<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NyayBot - Law at Your Fingertips</title>
    <link href="./output.css" rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen font-sans"
  >
    <!-- Main Content -->
    <main class="min-h-screen flex flex-col">
      <!-- Hero Section -->
      <section class="relative overflow-hidden flex-1">
        <!-- Background GIF with overlay -->
        <div class="absolute inset-0">
          <img
            src="../Status Quo Orange GIF by Kyocera.gif"
            alt="NyayBot Animation"
            class="w-full h-full object-cover opacity-20"
          />
          <div
            class="absolute inset-0 bg-gradient-to-b from-transparent via-slate-900/50 to-slate-900"
          ></div>
        </div>

        <!-- Hero Content -->
        <div
          class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-16 flex flex-col justify-center h-full"
        >
          <div class="text-center mb-12">
            <!-- Main Title -->
            <div class="mb-8">
              <h1
                class="text-5xl md:text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 mb-4"
              >
                NyayBot
              </h1>
              <div
                class="w-24 h-1 bg-gradient-to-r from-blue-500 to-purple-600 mx-auto rounded-full"
              ></div>
            </div>

            <!-- Subtitle -->
            <p
              class="text-xl md:text-2xl text-gray-300 max-w-4xl mx-auto leading-relaxed"
            >
              Your AI-powered legal companion — simplifying complex laws,
              guiding you through procedures, and giving you clarity when you
              need it the most.
            </p>
          </div>

          <!-- Chat Messages Container -->
          <div
            id="chatWindow"
            class="bg-white/5 backdrop-blur-sm rounded-3xl border border-white/10 p-6 min-h-[300px] max-h-[400px] overflow-y-auto flex flex-col-reverse mb-8"
          ></div>

          <!-- Long Prompt Bar -->
          <div
            class="bg-white/10 backdrop-blur-sm rounded-2xl border border-white/20 p-4"
          >
            <form class="flex items-center space-x-4">
              <!-- File Upload Button -->
              <label
                for="fileUpload"
                class="flex-shrink-0 w-12 h-12 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-300 border border-white/20"
              >
                <i class="fas fa-paperclip text-white text-lg"></i>
              </label>
              <input
                type="file"
                id="fileUpload"
                name="fileUpload"
                class="hidden"
                onchange="document.getElementById('fileName').textContent = this.files[0]?.name || ''"
              />

              <!-- Long Input Field -->
              <div class="flex-1 relative">
                <input
                  type="text"
                  id="legalQuery"
                  name="legalQuery"
                  placeholder="Ask me anything about law, legal procedures, or upload documents for analysis..."
                  class="w-full pl-6 pr-16 py-4 rounded-xl bg-white/10 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-white/20 text-lg"
                />
                <!-- Microphone Button -->
                <button
                  type="button"
                  class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-white transition-colors"
                  onclick="alert('🎙️ Recording initiated...')"
                >
                  <i class="fas fa-microphone text-xl"></i>
                </button>
              </div>

              <!-- Send Button -->
              <button
                type="submit"
                class="flex-shrink-0 px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-semibold rounded-xl hover:from-blue-600 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 flex items-center justify-center space-x-2"
              >
                <span>Send</span>
                <i class="fas fa-paper-plane"></i>
              </button>
            </form>
            <div id="fileName" class="text-sm text-gray-400 mt-3 ml-16"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
